# ⚠ 复制成 config.properties 再填自己的 key（config.properties 已被 .gitignore 忽略）
# JevIntent 插件配置 —— 本文件专用 key（2026-09-22 实测通过）
# 改完保存即可：每次长按都会自动重读配置（无需重载插件）

# ── 必填 ────────────────────────────────────────────────
# TypeSafe / Jev API Key（apikey_ 开头；留空则用插件内置 key）
api_key=

# 模型名：jev-latest（跟随最新）或固定 jev-1.13.0
model=jev-latest

# ── 结果发到哪（重点）────────────────────────────────────
# reply_mode=toast  ：【当前】只在本机弹提示，什么消息都不发，对方完全不知道
# reply_mode=quote  ：以"引用回复"发出 → 气泡挂在原消息下面（对方能看到）
# reply_mode=text   ：作为一条普通消息发出去
reply_mode=toast

# Toast 模式参数：每条约多少字（太长会被系统截断）／多条之间的间隔毫秒

toast_gap_ms=2000      # 三条 Toast 之间的间隔（v1.7 固定弹 3 条，不再按字数切）

# 引用块的正文放在哪个字段：title（默认，多数版本气泡显示 title）｜des
# 若发出去气泡是空的或只显示标题，把它改成 des 试试
quote_text_in=title

# 引用块里是否显示原消息发送者昵称（默认 false：不调用宿主的昵称接口，最稳）
# 若你的宿主版本支持 getUserRemark/getUserName，可改 true 让引用块显示昵称
quote_displayname=false

# private_mode=true ：结果【只发到自己的会话】，对方完全看不到（推荐配合 quote 用）
#   默认目标是「文件传输助手」，也可换成自己的小号 wxid
private_mode=false
self_talker=filehelper

# ── 意图预设（长按菜单里点一下就切换，存在同目录 presets.properties）────
# 上下文句数：目标消息【前 N 句 + 后 N 句】，0=关闭（关闭就不会调用宿主 getMsgs）
context_count=3
context_window_ms=1800000

# 未设置过的会话默认关系/性别
rel_default=普通朋友
sex_default=未知

# 长按菜单里「关系＝…」点一下切换的顺序（英文逗号分隔）
# 关系是"每个会话"的，所以放不进 设置.properties，仍用这个循环项切换
rel_options=普通朋友,陌生人,家人,情侣,死党,同事,客户,领导,同学,网友

# ── 其它可选 ────────────────────────────────────────────
endpoint=https://api.typesafe.ai/v1/systemone
timeout_ms=30000

# 生效会话白名单：留空=所有会话都能用；否则填 talker（群/好友 wxid），英文逗号分隔
whitelist=

# 结果里是否附带置信度/概率
show_confidence=true

# ── v1.4 三格 ───────────────────────────────────────────
# 情绪显示前几名（情绪 9 格：平静/高兴/不满/生气/焦虑/着急/难过/讽刺/客套）
# 比例 = Jev 返回的 probabilities 分布，低于 1% 的自动不显示
emotion_top=3

# 是否附带显示老的「意图 / 待回复 / 风险 / 建议」四项（默认 true）
# 改成 false → 输出只剩「情绪 / 着急 / 回复姿态」三格
show_legacy=true

# 着急程度：score 0~3（不着急/一般/急/非常急）
# ⚠ 这个问题的问法一旦上线就别再改字，改了等于换量尺，历史分数不可比

# 只给文本消息挂菜单（改 false 则图片/语音等也能长按）
text_only=true

# ── 设置都在同目录的 设置.properties 里 ─────────────────────
# v1.6 起：除"每个会话的关系"外，所有设置都改成在 设置.properties 里用 A/B/C 选项设置
#   · 该文件会在第一次长按时自动生成（带完整选项注释），且永远不会被自动覆盖
#   · 改完等号后面的字母 → 保存 → 长按消息立即生效，不用重载插件
#   · 它的优先级高于本文件；本文件保留作为兜底默认值
# 本文件里还有用的：api_key（Jev 密钥）、endpoint（接口地址）、timeout_ms（超时）
